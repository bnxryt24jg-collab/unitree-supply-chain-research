name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild generated data
        run: python src/build_dataset.py
      - name: Rebuild evidence manifest
        run: python src/build_evidence_manifest.py
      - name: Validate consistency
        run: python src/validate/check_consistency.py
      - name: Run tests
        run: python -m pytest -q
      - name: Fail on generated-file drift
        run: git diff --exit-code -- data/entities.json data/relations.json data/evidence_manifest.json
